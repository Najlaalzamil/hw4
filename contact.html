<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Najla Alzamil">
    <title>Najla Alzamil | Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body id="top">

    <header>
        <h1>Contact Me</h1>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="cv.html">CV</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Get in Touch</h2>

            <p>
                If you have any questions, please complete the form below.
            </p>

            <form
                class="contact-form"
                action="mailto:najlaalzamil@gmail.com"
                method="post"
                enctype="text/plain">

                <fieldset>
                    <legend>Contact Me</legend>

                    <p>
                        <label for="firstName">First Name:</label>
                        <input
                            type="text"
                            id="firstName"
                            name="firstName"
                            autocomplete="given-name"
                            required>
                    </p>

                    <p>
                        <label for="lastName">Last Name:</label>
                        <input
                            type="text"
                            id="lastName"
                            name="lastName"
                            autocomplete="family-name"
                            required>
                    </p>

                    <p>
                        <label for="email">Email:</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required>
                    </p>

                    <p>
                        <label for="message">Message:</label>
                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            required></textarea>
                    </p>

                    <p>
                        <button type="submit">Send</button>
                    </p>

                </fieldset>
            </form>
        </section>

        <section>
            <h2>Direct Contact</h2>

            <p>
                Or email me directly:
                <a href="mailto:najlaalzamil@gmail.com">
                    najlaalzamil@gmail.com
                </a>
            </p>
        </section>

        <p class="back-to-top">
            <a href="#top">Back to Top</a>
        </p>

    </main>

    <footer>
        <p>&copy; 2026 Najla's Website</p>
    </footer>

</body>
</html>
